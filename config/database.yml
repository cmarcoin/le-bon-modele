default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("DB_POOL", ENV.fetch("RAILS_MAX_THREADS", 3)) %>

development:
  <<: *default
  host: <%= ENV["DATABASE_HOST"].presence || "localhost" %>
  port: <%= ENV["DATABASE_PORT"].presence || 5432 %>
  username: <%= ENV["DATABASE_USERNAME"].presence || "postgres" %>
  password: <%= ENV["DATABASE_PASSWORD"].presence || "password" %>
  database: <%= (ENV["DATABASE_NAME"].presence || "herve_2") %>_development

test:
  <<: *default
  host: <%= ENV["DATABASE_HOST"].presence || "localhost" %>
  port: <%= ENV["DATABASE_PORT"].presence || 5432 %>
  username: <%= ENV["DATABASE_USERNAME"].presence || "postgres" %>
  password: <%= ENV["DATABASE_PASSWORD"].presence || "password" %>
  database: <%= (ENV["DATABASE_NAME"].presence || "herve_2") %>_test

# Scalingo: use DATABASE_URL for production DBs (primary + queue).
# https://doc.scalingo.com/languages/ruby/rails/solid-queue
#
# Solid Cache / Solid Cable are disabled (see Gemfile). To restore, uncomment cache and cable below,
# re-enable the gems, and run `bin/rails db:prepare`.
production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>

  queue:
    <<: *primary_production
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
    # Solid Queue: one connection per worker thread plus 2 (polling + heartbeat).
    pool: <%= ENV.fetch("SOLID_QUEUE_DB_POOL", ENV.fetch("SOLID_QUEUE_THREADS", 2).to_i + 2) %>

  # cache:
  #   <<: *primary_production
  #   url: <%= ENV["DATABASE_URL"] %>
  #   migrations_paths: db/cache_migrate

  # cable:
